services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: advance
      POSTGRES_PASSWORD: advance
      POSTGRES_DB: advance
    ports:
      # host 5433: 5432 is often taken by a local Postgres install
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advance -d advance"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
